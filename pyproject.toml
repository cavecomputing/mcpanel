[project]
name = "mcpanel"
version = "0.0.0" # Packaging placeholder; running builds use their Git commit.
description = "A small web panel for hosting Minecraft servers in Docker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "docker>=7.1",
    "flask>=3.1",
    "gunicorn>=23.0",
    "pyotp>=2.9",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false
